<!-- 02/out/2026: instalável no Chrome/Safari do computador ("Instalar Oscarpes"):
     abre em janela própria com o ícone da folha. Sempre carrega do site, então

<link rel="manifest" href="manifest.webmanifest">

<title>Oscarpes ao vivo</title>
<!--
  OSCARPES AO VIVO — a conversa por voz que abre painéis na tela (02/out/2026)
  ============================================================================
  João: "o cliente abriria o app ou o site e apareceria uma especie de um agente
  esperando uma pergunta dele, conforme ele fosse conversando e pedindo as
  coisas ela ia abrindo na tela, e ele ia dizendo como estava as coisas" —
  "mais moderno e futurista", "ouvindo e respondendo em tempo integral", e
  "não vai apagar o que fizemos": esta página é SEPARADA do app (public/), não
  toca em tela nenhuma; o app normal continua igual.

  COMO FUNCIONA
  - Ouve pelo navegador (SpeechRecognition contínuo), manda o texto para a MESMA
    rota do Jarvis (whatsapp/voz, com telas:true) e fala a resposta.
  - O servidor devolve, além da fala, o RESULTADO das consultas que o agente fez
    (chuva, painel do monitoramento, fertilidade, contas, agenda…), já filtrado
    pelo cargo de quem está logado. Esta página só DESENHA — não lê banco.
  - Login: a mesma sessão do app (localStorage sb-<ref>-auth-token, mesmo
    endereço). Sem sessão, manda entrar no app.
  - A VOZ é um módulo trocável (objeto Voz abaixo): hoje a melhor voz pt-BR do
    aparelho; o João vai escolher a definitiva depois.
  - Nome na tela: "Oscarpes" (decisão do João, 01/out: Jarvis é só o projeto).

  A chave pública do Supabase (eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqdGZ3aXBncWVyeWV1a3JleXN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNTI1MTksImV4cCI6MjA5MjcyODUxOX0.DG0pLGoPbo8W50_AeXb1zA0BALCchyKPAGFfP3hghcM) é trocada na publicação
  (scripts/deploy-web.sh); ela é pública por natureza, só não mora no git.
-->
<style>
:root{
  /* Paleta da Oscarpes (PLANO.md seção 6) — João, 02/out: "use as cores da oscarpes, mas mantenha a modernidade".
     --ciano/--ciano2 ficaram com o nome antigo, mas agora são o VERDE-CLARO da marca e o verde escuro. */
  --bg:#0b1102; --bg2:#141d05; --ciano:#c4ca3c; --ciano2:#7d8420; --txt:#f1e9c4; --mudo:#b3a97a;
  --ouro:#f9a322; --folha:#a2a72a; --vidro:rgba(27,39,4,.62); --borda:rgba(162,167,42,.38); --perigo:#ff6b6b;
  /* VIDRO (02/out/2026) — João, na TV grande: "as páginas naquele estilo transparência, de uma forma bem
     moderna" e "a imagem não era moderna igual na versão azul". É o vidro do protótipo azul
     (~/VozJarvis/tela): fundo translúcido com desfoque, borda fina luminosa, brilho por dentro —
     nas cores da marca (verde-claro, oliva e ouro), nunca azul. */
  --vidro-a:rgba(196,202,60,.10); --vidro-b:rgba(24,34,6,.36); --vidro-c:rgba(11,17,2,.56);
  --vidro-borda:rgba(214,220,110,.34); --vidro-brilho:rgba(241,233,196,.18);
  /* com painéis a folha encolhe para o topo e a tela fica para as janelas */
  --folha-h:clamp(58px,8.5vh,124px);
  --topo-paineis:calc(14px + env(safe-area-inset-top) + var(--folha-h) + 30px);
  --base-paineis:calc(184px + env(safe-area-inset-bottom));
}
/* letra que cresce com a tela: 1920 px (TV) → 18 px; 3840 → 24 px; celular fica em 14 px.
   Dentro dos painéis os números crescem com a LARGURA DO PAINEL (cqi). */
html{font-size:clamp(14px,.5vw + 8.4px,24px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Inter","Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{background:
  radial-gradient(1200px 800px at 50% 38%,rgba(162,167,42,.14),transparent 65%),
  radial-gradient(700px 500px at 85% 110%,rgba(249,163,34,.07),transparent 70%),
  linear-gradient(rgba(162,167,42,.045) 1px,transparent 1px) 0 0/100% 46px,
  linear-gradient(90deg,rgba(162,167,42,.035) 1px,transparent 1px) 0 0/46px 100%, var(--bg)}
#fundo{position:fixed;inset:0;z-index:0}
/* as bolinhas da folha voam por cima das janelas (e não atrás do vidro: assim o desfoque não
   precisa ser refeito a cada quadro) — sem pegar clique */
#particulas{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.topo{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top));left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;
  font:600 12px Menlo,ui-monospace,monospace;letter-spacing:.32em;color:var(--ciano)}
.marca{display:flex;align-items:center;gap:10px}
.marca img{display:block}
#hora{font-size:22px;letter-spacing:.06em;text-shadow:0 0 18px rgba(162,167,42,.55)}
#limpar{display:none;background:rgba(20,29,5,.4);border:1px solid var(--vidro-borda);color:var(--mudo);border-radius:999px;font:600 10px Menlo,monospace;letter-spacing:.2em;padding:6px 12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.com-paineis #limpar{display:inline-block}
/* #esfera é só a CAIXA da folha (onde ela fica e onde se toca); quem desenha é o #particulas */
#esfera{position:fixed;z-index:5;left:50%;top:42%;width:min(62vmin,520px);height:min(62vmin,520px);transform:translate(-50%,-50%);transition:all .9s cubic-bezier(.2,.8,.2,1);cursor:pointer;border-radius:50%}
body.com-paineis #esfera{width:var(--folha-h);height:var(--folha-h);top:calc(14px + env(safe-area-inset-top) + var(--folha-h) / 2)}
#estado.chama{color:var(--ouro);animation:pulsa 1.6s ease-in-out infinite}
#estado{position:fixed;z-index:5;left:0;right:0;top:calc(42% + min(31vmin,260px) + 8px);text-align:center;font:600 11px Menlo,monospace;letter-spacing:.45em;color:var(--ciano2);transition:top .9s;pointer-events:none}
body.com-paineis #estado{top:calc(14px + env(safe-area-inset-top) + var(--folha-h) + 4px);font-size:10px}

/* LEGENDA (02/out/2026) — João: "estou numa tv bem grande e a legenda ocupou quase a tela toda".
   Agora é uma faixa baixa e curta (no máximo 2 linhas, ~60 letras por linha), de vidro, que some
   sozinha depois da fala: o que a voz diz é curto e o detalhe mora nos painéis. */
#legenda{position:fixed;z-index:6;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  width:max-content;max-width:min(60ch,92vw);text-align:center;font-size:clamp(14px,.6vw + 8px,22px);line-height:1.4;color:var(--txt);
  padding:.4em 1.1em;border-radius:14px;background:rgba(11,17,2,.55);border:1px solid rgba(196,202,60,.2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transition:opacity .6s,transform .6s;pointer-events:none}
#legenda.on{opacity:1;transform:translate(-50%,0)}
#legenda:empty{display:none}
/* as 2 linhas ficam no texto de dentro (com o respiro na caixa de fora a 3ª linha vazava pela borda) */
#legenda .txt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
#legenda .voce{color:var(--mudo);font-style:italic}
#legenda small{font-size:.8em}

/* ÁREA DOS PAINÉIS: tudo o que sobra entre a folha (topo) e a legenda (base) */
#paineis{position:fixed;z-index:3;left:0;right:0;top:var(--topo-paineis);bottom:var(--base-paineis);padding:0 clamp(16px,2.2vw,56px);display:none;flex-direction:row;gap:clamp(12px,1.2vw,28px)}
body.com-paineis #paineis{display:flex}
.grade{flex:1 1 auto;min-height:0;display:grid;gap:clamp(12px,1.2vw,28px);margin:0 auto;width:100%;grid-template-rows:minmax(0,1fr)}
.grade>.painel{min-height:0;max-height:100%}
.grade.uma-linha>.painel:not([data-tipo=imagem]){align-self:center}
.grade>.painel[data-tipo=numeros]:first-child{align-self:stretch}
/* a faixa de números no alto (resposta repartida): baixa, para sobrar altura às listas */
.grade.faixa>.painel:first-child .kpis{grid-template-columns:repeat(auto-fit,minmax(clamp(130px,14cqi,280px),1fr));margin:0}
.grade.faixa>.painel:first-child .kpi b{font-size:clamp(1.4rem,3.4cqi,3.4rem)}
.grade.faixa>.painel:first-child .cab{margin-bottom:.5em}
#saindo{position:fixed;inset:0;z-index:3;pointer-events:none}
#pontos{display:none}
/* FOCO (02/out/2026, João: "quando eu clicar em alguma das telas, ela expandir para eu olhar o todo e
   conseguir navegar nela"): a janela em foco ocupa a área inteira; as outras viram MINIATURAS na tira
   ao lado (também quando há mais janelas do que cabem legíveis — nunca janela minúscula). */
#miniaturas{display:none;flex:none;width:clamp(200px,15vw,300px);flex-direction:column;gap:10px;overflow-y:auto;padding:2px;scrollbar-width:thin}
body.com-tira #miniaturas{display:flex}
.painel:not(.focado):not(.miniatura){cursor:zoom-in}
.painel.oculta{display:none}
.painel.pronto{animation:none;opacity:1}
.painel.pronto::before{animation:none;background-position:50% 0,-60% 0}
.painel.pronto .moldura .quadro::after{display:none}
.painel.miniatura{flex:none;cursor:pointer;opacity:.72;padding:10px 14px;transition:opacity .2s;max-height:none}
.painel.miniatura:hover{opacity:1}
.painel.miniatura .corpo,.painel.miniatura .explorar,.painel.miniatura .sub,.painel.miniatura .botoes{display:none !important}
/* miniatura de mapa mostra o mapa pequeno (dá para reconhecer qual é) */
.painel.miniatura[data-tipo=imagem] .corpo{display:block !important;height:clamp(70px,9vh,120px);margin-top:6px;pointer-events:none;overflow:hidden}
.painel.miniatura[data-tipo=imagem] .moldura{height:100%;padding:4px}
.painel.miniatura[data-tipo=imagem] figcaption,.painel.miniatura .zoom-ctl{display:none !important}
.painel.miniatura .cab{margin:0}
.painel.miniatura .titulo{font-size:.95rem}
.painel.focado{box-shadow:inset 0 1px 0 var(--vidro-brilho),inset 0 0 90px rgba(162,167,42,.09),0 0 60px rgba(196,202,60,.22),0 30px 90px rgba(0,0,0,.6);border-color:rgba(214,220,110,.5)}
.painel.focado svg.graf{max-height:62vh}
.botoes{display:flex;gap:8px;flex:none}
.expandir{flex:none;background:rgba(11,17,2,.3);border:1px solid var(--vidro-borda);color:var(--ciano);border-radius:999px;font:600 13px Menlo,monospace;min-width:2.2em;height:2.2em;padding:0 .6em;cursor:pointer}
.expandir .volta{display:none;font-size:10px;letter-spacing:.2em}
.painel.focado .expandir .abre{display:none}
.painel.focado .expandir .volta{display:inline}
/* explorar o assunto (só no foco) */
.explorar{display:none;flex:none;flex-wrap:wrap;gap:8px;align-items:center;margin-top:.7em;padding-top:.8em;border-top:1px solid rgba(196,202,60,.15)}
.painel.focado .explorar{display:flex}
.explorar button{background:rgba(196,202,60,.07);border:1px solid rgba(196,202,60,.3);color:var(--txt);border-radius:999px;padding:.5em 1em;font-size:.85rem;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.explorar button:hover{background:rgba(196,202,60,.16)}
.explorar .explorar-tudo{font:600 .72rem Menlo,monospace;letter-spacing:.2em;color:#1b2704;background:linear-gradient(90deg,#a2a72a,#c4ca3c);border:0;box-shadow:0 0 22px rgba(162,167,42,.35)}
/* mapa navegável no foco: palco que recebe o zoom/arrasto e os botões + − ⟲ */
.palco{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.zoom-ctl{display:none;position:absolute;right:10px;bottom:10px;z-index:2;gap:6px;align-items:center;padding:5px;border-radius:999px;background:rgba(11,17,2,.6);border:1px solid var(--vidro-borda);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.zoom-ctl button{width:2.1em;height:2.1em;border-radius:50%;border:1px solid rgba(196,202,60,.35);background:rgba(196,202,60,.08);color:var(--txt);font-size:1rem;cursor:pointer}
.zoom-valor{font:600 .66rem Menlo,monospace;color:var(--mudo);min-width:3.6em;text-align:center}
.painel.focado .zoom-ctl{display:flex}
.painel.focado .quadro{cursor:grab;touch-action:none}
.painel.focado .moldura .quadro::after{display:none}

/* O PAINEL DE VIDRO */
.painel{position:relative;display:flex;flex-direction:column;min-width:0;container-type:inline-size;
  background:linear-gradient(150deg,var(--vidro-a),var(--vidro-b) 38%,var(--vidro-c));
  border:1px solid var(--vidro-borda);border-radius:clamp(14px,1.1vw,22px);
  padding:clamp(14px,1.2vw,28px) clamp(16px,1.4vw,32px);
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--vidro-brilho),inset 0 0 70px rgba(162,167,42,.07),0 0 36px rgba(162,167,42,.14),0 28px 70px rgba(0,0,0,.5);
  animation:materializa .85s cubic-bezier(.16,.9,.2,1) var(--atraso,0ms) both}
/* risco de luz no alto + o brilho que varre o vidro uma vez quando a janela nasce */
.painel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(241,233,196,.6),transparent) 50% 0/62% 1px no-repeat,
             linear-gradient(115deg,transparent 40%,rgba(214,220,110,.16) 50%,transparent 60%) 120% 0/250% 100% no-repeat;
  animation:varre 2.4s ease-out calc(var(--atraso,0ms) + .25s) both}
/* cantoneiras de HUD (ouro) */
.painel::after{content:"";position:absolute;inset:7px;border-radius:calc(clamp(14px,1.1vw,22px) - 5px);pointer-events:none;opacity:.6;
  background:
    linear-gradient(var(--ouro),var(--ouro)) 0 0/16px 1.5px no-repeat, linear-gradient(var(--ouro),var(--ouro)) 0 0/1.5px 16px no-repeat,
    linear-gradient(var(--ouro),var(--ouro)) 100% 0/16px 1.5px no-repeat, linear-gradient(var(--ouro),var(--ouro)) 100% 0/1.5px 16px no-repeat,
    linear-gradient(var(--ouro),var(--ouro)) 0 100%/16px 1.5px no-repeat, linear-gradient(var(--ouro),var(--ouro)) 0 100%/1.5px 16px no-repeat,
    linear-gradient(var(--ouro),var(--ouro)) 100% 100%/16px 1.5px no-repeat, linear-gradient(var(--ouro),var(--ouro)) 100% 100%/1.5px 16px no-repeat}
@keyframes materializa{
  0%{opacity:0;clip-path:inset(46% 46% round 22px);filter:blur(14px) brightness(1.9)}
  40%{opacity:1}
  100%{opacity:1;clip-path:inset(-90px -90px round 22px);filter:none}}
@keyframes varre{from{background-position:50% 0,120% 0}to{background-position:50% 0,-60% 0}}
.painel.saindo{position:fixed;margin:0;animation:dissolve .55s ease-in both}
.painel.saindo::before{animation:none}
@keyframes dissolve{0%{opacity:1}100%{opacity:0;filter:blur(16px) brightness(1.8);transform:scale(1.04)}}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:clamp(8px,.9vw,18px);flex:none}
.rotulo{display:flex;align-items:center;gap:.7em;font:600 .68rem Menlo,ui-monospace,monospace;letter-spacing:.28em;color:var(--ciano);text-transform:uppercase}
.rotulo::before{content:"";flex:none;width:.55em;height:.55em;background:var(--ouro);box-shadow:0 0 10px var(--ouro);border-radius:1px}
.rotulo .indice{color:var(--mudo);letter-spacing:.18em;opacity:.85}
.titulo{font-size:1.35rem;font-size:clamp(1.1rem,3.6cqi,2rem);font-weight:700;line-height:1.15;margin-top:.3em;text-shadow:0 0 24px rgba(196,202,60,.18)}
.sub{color:var(--mudo);font-size:.86rem;margin-top:.25em}
.fechar{flex:none;background:rgba(11,17,2,.3);border:1px solid var(--vidro-borda);color:var(--mudo);border-radius:999px;font:600 11px Menlo,monospace;width:2.2em;height:2.2em;cursor:pointer;pointer-events:auto}
.corpo{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(196,202,60,.3) transparent}
.painel[data-tipo=numeros] .corpo{display:flex;flex-direction:column;justify-content:safe center}
/* números grandes, legíveis do sofá */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(100px,19cqi,250px),1fr));gap:clamp(8px,1.6cqi,18px);margin:.2em 0 1em}
.kpi{position:relative;padding:clamp(10px,2.2cqi,20px);border-radius:12px;background:linear-gradient(160deg,rgba(196,202,60,.11),rgba(196,202,60,.02));border:1px solid rgba(196,202,60,.2);box-shadow:inset 0 1px 0 rgba(241,233,196,.08)}
.kpi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.8rem;font-size:clamp(1.4rem,6cqi,4.2rem);color:var(--ouro);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(249,163,34,.35)}
.kpi b small{font-size:.5em;font-weight:600;margin:0 .15em;opacity:.85}
.kpi span{display:block;margin-top:.45em;font:600 .64rem Menlo,monospace;letter-spacing:.16em;color:var(--mudo);text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:1rem;font-size:clamp(.9rem,2.3cqi,1.15rem)}
th{font:600 .62rem Menlo,monospace;letter-spacing:.16em;color:var(--mudo);text-transform:uppercase;text-align:left;padding:.5em .5em;border-bottom:1px solid rgba(196,202,60,.28);position:sticky;top:0;background:rgba(14,21,3,.85);backdrop-filter:blur(6px)}
td{padding:.45em .5em;border-bottom:1px solid rgba(196,202,60,.09);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.alerta td{color:#ffc27a}
.tag{display:inline-block;font:600 .6rem Menlo,monospace;letter-spacing:.12em;padding:2px 7px;border:1px solid rgba(196,202,60,.55);border-radius:999px;color:#d8dc6a;margin-left:6px;vertical-align:middle}
.nota{color:var(--mudo);font-size:.82rem;margin-top:.8em}
.texto-livre{white-space:pre-wrap;font-size:1rem;line-height:1.5}
svg.graf{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
/* gráfico encolhe para caber na janela (a TV não rola) */
.painel[data-tipo=grafico] .corpo{display:flex;flex-direction:column}
.painel[data-tipo=grafico] svg.graf{flex:1 1 auto;min-height:110px;max-height:46vh}
.painel[data-tipo=grafico] .kpis{grid-template-columns:repeat(auto-fit,minmax(clamp(84px,15cqi,220px),1fr));margin-bottom:.6em}
.painel[data-tipo=grafico] .kpi b{font-size:clamp(1.25rem,4.6cqi,3.2rem)}
/* janela de gráfico LARGA (a vaga comprida na TV): números à esquerda, gráfico à direita */
@container (min-width: 760px){
  .painel[data-tipo=grafico] .corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-auto-rows:min-content;column-gap:1.6em;align-content:safe center}
  .painel[data-tipo=grafico] .kpis{grid-column:1;grid-row:1 / span 2;margin:0;align-self:center;grid-template-columns:repeat(auto-fit,minmax(clamp(84px,11cqi,210px),1fr))}
  .painel[data-tipo=grafico] .kpi{padding:clamp(8px,1.1cqi,16px)}
  .painel[data-tipo=grafico] .kpi b{font-size:clamp(1.1rem,2.7cqi,2.6rem)}
  .painel[data-tipo=grafico] svg.graf{grid-column:2;grid-row:1;max-height:40vh}
  .painel[data-tipo=grafico] .nota{grid-column:2}
}
.barras-nut{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:.55em .9em;align-items:center;font-size:1rem}
.trilho{position:relative;height:.7em;border-radius:999px;background:rgba(196,202,60,.08);box-shadow:inset 0 0 0 1px rgba(196,202,60,.12)}
.trilho i{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--ciano2),var(--ciano));opacity:.6;box-shadow:0 0 12px rgba(196,202,60,.35)}
.trilho em{position:absolute;top:-.3em;width:3px;height:1.3em;border-radius:2px;background:var(--ouro);box-shadow:0 0 10px var(--ouro)}
/* IMAGEM / MAPA numa moldura de vidro (nunca mais a imagem crua e chapada) */
.painel[data-tipo=imagem] .corpo{display:flex;flex-direction:column}
.moldura{position:relative;flex:1 1 auto;min-height:0;margin:0;display:flex;flex-direction:column;gap:.6em;padding:clamp(8px,1.4cqi,16px);border-radius:14px;
  background:radial-gradient(120% 90% at 50% 40%,rgba(196,202,60,.10),rgba(11,17,2,.35));border:1px solid rgba(196,202,60,.26);box-shadow:inset 0 0 40px rgba(162,167,42,.12)}
.moldura .quadro{position:relative;flex:1 1 auto;min-height:clamp(140px,22vh,260px);overflow:hidden;border-radius:10px}
/* O MAPA INTEIRO, SEMPRE (02/out/2026, noite — João: "o mapa não abriu legal, mostrou só uma ponta do mapa").
   A causa: a imagem ficava dentro de uma grade com linha "auto" (.quadro e .palco eram display:grid). A linha
   crescia até a ALTURA NATURAL do PNG (1080 px) — o max-height:100% da imagem não tinha contra o que medir —
   e o overflow:hidden do quadro cortava o resto: na janela pequena sobrava o canto de cima. Agora o palco e a
   imagem são PRESOS ao quadro (absolute + inset:0) e a imagem é "contain": a fazenda inteira cabe em qualquer
   tamanho de janela; o zoom e o arrasto começam do "caber na tela". */
.moldura img{display:block;position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;border-radius:8px;filter:drop-shadow(0 0 18px rgba(196,202,60,.22))}
.moldura .quadro::after{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(214,220,110,.16),transparent);animation:escaneia 2.8s ease-in-out calc(var(--atraso,0ms) + .5s) 1 both}
@keyframes escaneia{from{top:-25%}to{top:105%}}
.moldura figcaption{font:600 .64rem Menlo,monospace;letter-spacing:.18em;color:var(--mudo);text-transform:uppercase;text-align:center}
.controles{position:fixed;z-index:7;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:12px;padding:0 16px}
#mic{width:64px;height:64px;border-radius:50%;border:1px solid var(--ciano);background:radial-gradient(circle,rgba(162,167,42,.25),rgba(11,17,2,.92));
  color:var(--ciano);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 30px rgba(162,167,42,.25)}
#mic.ativo{border-color:var(--ouro);color:var(--ouro);box-shadow:0 0 40px rgba(249,163,34,.35);animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 60px rgba(249,163,34,.55)}}
#mic svg{width:28px;height:28px}
#mic.chama{width:84px;height:84px;border-color:var(--ouro);color:var(--ouro);box-shadow:0 0 60px rgba(249,163,34,.6);animation:pulsa 1.2s ease-in-out infinite}
#caixa{flex:0 1 420px;display:flex;background:rgba(20,29,5,.55);border:1px solid var(--borda);border-radius:999px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#caixa input{flex:1;background:none;border:0;color:var(--txt);font-size:15px;padding:12px 16px;outline:none;min-width:0}
#caixa button{background:none;border:0;border-left:1px solid var(--borda);color:var(--ciano);font:600 11px Menlo,monospace;letter-spacing:.2em;padding:0 16px;cursor:pointer}
#abertura{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(27,39,4,.55),rgba(11,17,2,.95))}

#comecar{font:600 13px Menlo,monospace;letter-spacing:.35em;color:#1b2704;background:linear-gradient(90deg,#a2a72a,#c4ca3c);border:0;padding:16px 28px;cursor:pointer;box-shadow:0 0 40px rgba(162,167,42,.45)}
#aviso{position:fixed;z-index:21;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);max-width:92vw;background:rgba(40,10,10,.9);border:1px solid var(--perigo);color:#ffd6d6;padding:10px 14px;font-size:14px;display:none}

/* CELULAR: uma janela por vez, de lado a lado (arrasta para o lado), com pontinhos embaixo */
@media (max-width:759px){
  :root{--folha-h:22vmin;--topo-paineis:calc(58px + env(safe-area-inset-top) + var(--folha-h) + 24px);--base-paineis:calc(152px + env(safe-area-inset-bottom))}
  #esfera{top:36%} #estado{top:calc(36% + 31vmin + 6px)}
  body.com-paineis #esfera{top:calc(58px + env(safe-area-inset-top) + var(--folha-h) / 2)}
  body.com-paineis #estado{top:calc(58px + env(safe-area-inset-top) + var(--folha-h) + 4px)}
  #paineis{padding:0;flex-direction:column;gap:0}
  body.em-foco #paineis{top:calc(52px + env(safe-area-inset-top))}

  body.em-foco #esfera{width:34px;height:34px;top:calc(30px + env(safe-area-inset-top))}

  .grade::-webkit-scrollbar{display:none}

  .painel{backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%)}
  #pontos{display:flex;justify-content:center;gap:7px;padding-top:9px;flex:none}
  #pontos i{width:7px;height:7px;border-radius:50%;background:rgba(196,202,60,.25);transition:all .3s}

  .moldura .quadro{min-height:42vh}
  #hora{font-size:18px} .topo{letter-spacing:.2em}
  #caixa{flex:1}
  #legenda{bottom:calc(92px + env(safe-area-inset-bottom))}
  body.com-paineis #hora{display:none}
  #limpar{font-size:9px;letter-spacing:.12em;padding:5px 9px}
}

/* CAMADAS DO MAPA (02/out/2026, noite): os mapas da MESMA fazenda (P, K, pH, MO…) numa janela só, com abas */
.camadas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.5em;flex:none}

#visor .quadro{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;cursor:grab;touch-action:none}

#visor .zoom-ctl{display:flex;right:18px;bottom:calc(18px + env(safe-area-inset-bottom))}
#visor .dica{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));font:600 .62rem Menlo,monospace;letter-spacing:.14em;color:var(--mudo);pointer-events:none}

/* MODO FAZENDA / GRUPO (02/out/2026, 22:10 — João: "trazer um quadrado para o lado esquerdo com toda a navegação
   de todas as opções e as janelas irem alterando no lado direito maior, mantendo a mesma modernidade"). Em espera
   só a folha no meio; aberto o dossiê, a folha sobe pequena, a navegação de vidro fica à esquerda e as janelas
   da seção escolhida à direita. */
#navFazenda{display:none}
body.modo-fazenda{--folha-h:clamp(36px,4.6vh,58px);--topo-paineis:calc(14px + env(safe-area-inset-top) + var(--folha-h) + 12px);--base-paineis:calc(98px + env(safe-area-inset-bottom))}

#navFazenda .cab{margin-bottom:.2em}

#navFazenda .item i{flex:none;width:1.5em;height:1.5em;display:grid;place-items:center;color:var(--ciano);font-style:normal}
#navFazenda .item i svg{width:1.2em;height:1.2em}
#navFazenda .item span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#navFazenda .item small{flex:none;font:600 .62rem Menlo,monospace;letter-spacing:.06em;color:var(--mudo);max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#navFazenda .item small.alerta{color:var(--ouro)}
#navFazenda .fazendas{display:flex;flex-wrap:wrap;gap:5px;flex:none;max-height:9.5em;overflow-y:auto}
#navFazenda .fazendas button{background:rgba(196,202,60,.05);border:1px solid rgba(196,202,60,.25);color:var(--mudo);border-radius:999px;padding:.3em .75em;font-size:.78rem;cursor:pointer}
#navFazenda .fazendas button.on{color:#1b2704;background:linear-gradient(90deg,#a2a72a,#c4ca3c);border-color:transparent}
#navFazenda .rodape{flex:none;display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid rgba(196,202,60,.15);padding-top:.6em}
#navFazenda .rodape button{background:rgba(11,17,2,.3);border:1px solid var(--vidro-borda);color:var(--mudo);border-radius:999px;font:600 .62rem Menlo,monospace;letter-spacing:.16em;padding:.5em 1em;cursor:pointer}
#navFazenda .rodape .nota{margin:0;font-size:.7rem}
/* MOSAICO — o resumo em ladrilhos que enchem a área (sem rolar e sem faixa vazia) */
.grade.mosaico{grid-auto-flow:dense}
.grade.mosaico>.painel{max-height:none;align-self:stretch !important;padding:clamp(10px,.9vw,20px) clamp(12px,1vw,22px)}
.grade.mosaico>.painel .cab{margin-bottom:.4em}
.grade.mosaico>.painel .titulo{font-size:clamp(.95rem,5.2cqi,1.45rem)}
.grade.mosaico .kpis{grid-template-columns:repeat(auto-fit,minmax(clamp(74px,17cqi,150px),1fr));gap:6px;margin:0}
.grade.mosaico .kpi{padding:clamp(5px,1.4cqi,10px) clamp(6px,1.6cqi,12px)}
.grade.mosaico .kpi b{font-size:clamp(1rem,4.4cqi,2.2rem)}
.grade.mosaico .kpi span{font-size:.58rem;margin-top:.3em}
.grade.mosaico table{font-size:clamp(.78rem,3.4cqi,.98rem)}

.painel[data-tipo=largo] .corpo{display:flex;flex-direction:column;gap:.4em}
.painel[data-tipo=ladrilho] .corpo{display:flex;flex-direction:column;gap:.5em;overflow:hidden}
.painel[data-tipo=ladrilho] .corpo>svg{flex:1 1 auto;min-height:0;width:100%;height:100%}

.barrinhas .b{height:.5em;border-radius:999px;background:rgba(196,202,60,.08);overflow:hidden}

.barrinhas .nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrinhas .n{font-variant-numeric:tabular-nums;color:var(--mudo);font-size:.8rem}
.lista-curta{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.35em;font-size:.88rem}

.lista-curta li.ok::before{background:var(--ciano);box-shadow:0 0 8px var(--ciano)}

.janelas span.ok{color:#1b2704;background:var(--ciano);border-color:transparent}

.painel[data-tipo=ladrilho] .corpo>svg.mini{min-height:44px}

.chips-talhao button.on{color:var(--txt);border-color:var(--ouro);box-shadow:0 0 10px rgba(249,163,34,.3)}
svg.mini{display:block;width:100%;height:100%;overflow:visible}
/* desenho (mapa dos talhões, fazendas do grupo) ocupa a janela inteira */
.corpo:has(> svg.mini){display:flex;flex-direction:column}
.corpo > svg.mini{flex:1 1 auto;min-height:120px}
svg.evol{display:block;width:100%;height:100%;max-height:100%}
/* a linha da lavoura: no celular ela rola para o lado (largura de leitura), na tela grande cabe inteira */
.rolagem{flex:1 1 auto;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
@media (max-width:759px){ .rolagem svg.evol{width:920px;height:auto;max-height:none} }
.legenda-cor{display:flex;flex-wrap:wrap;gap:.4em 1em;font:600 .6rem Menlo,monospace;letter-spacing:.08em;color:var(--mudo);flex:none}

.calor .h{color:var(--mudo);font:600 .58rem Menlo,monospace;letter-spacing:.08em;text-align:center;background:none}
.calor .t{color:var(--txt);background:none;text-align:left}
@media (max-width:759px){
  /* celular: a navegação vira uma barra de botões no alto, uma janela por vez embaixo */
  body.modo-fazenda{--folha-h:22px;--topo-paineis:calc(52px + env(safe-area-inset-top));--base-paineis:calc(150px + env(safe-area-inset-bottom))}
  body.modo-fazenda #esfera{top:calc(30px + env(safe-area-inset-top))}
  body.modo-fazenda #navFazenda{width:auto;flex-direction:row;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 10px;margin:0 16px 8px;border-radius:14px;scrollbar-width:none}
  body.modo-fazenda #navFazenda::-webkit-scrollbar{display:none}
  #navFazenda .cab,#navFazenda .rodape .nota{display:none}
  #navFazenda .lista{flex-direction:row;overflow:visible;gap:6px}
  #navFazenda .item{width:auto;flex:none;padding:.4em .7em;font-size:.82rem;border-color:rgba(196,202,60,.22);border-radius:999px}

  body.modo-fazenda .marca span{display:none}
}

@media (prefers-reduced-motion:reduce){

}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes some{to{opacity:0}}

const TETO_PAINEIS = 6;
/** Reparte as respostas em janelas: na tela larga, números e lista em janelas
 *  separadas e lista longa em pedaços (até TETO_PAINEIS); no celular, uma por resposta. */
function distribuir(corpos, largo) {
  const lista = corpos.filter((c) => c && Array.isArray(c.blocos) && c.blocos.length).slice(0, TETO_PAINEIS);
  if (!largo) return lista;
  const LINHAS = 8;
  // resposta que já traz muitas consultas não é partida (cada uma na sua janela);
  // a partição é para quando vem POUCA coisa com muito dentro
  const limite = lista.length >= 4 ? lista.length : lista.length === 3 ? 4 : TETO_PAINEIS;
  let sobra = limite - lista.length;
  const out = [];
  for (const c of lista) {
    const tab = c.blocos.find((b) => b.tipo === 'tabela');
    const visuais = c.blocos.filter((b) => b !== tab && b.tipo !== 'nota');
    if (!tab || !tab.linhas.length) { out.push(c); continue; }
    // lista curta (até 6 linhas) fica junto dos números: uma janela cheia, não duas pela metade
    if (tab.linhas.length <= 6) { out.push(c); continue; }
    let resto = tab.linhas, primeiro = c;
    if (visuais.length && sobra > 0) {           // números/gráfico numa janela, a lista em outra
      out.push({ ...c, origem: c, blocos: c.blocos.filter((b) => b !== tab) });
      sobra--;
      primeiro = { rotulo: c.rotulo, titulo: c.tituloLista || c.titulo, sub: '', blocos: [], origem: c };
    } else primeiro = { ...c, origem: c, blocos: c.blocos.filter((b) => b !== tab) };
    const total = resto.length;
    const pedacos = [];
    while (resto.length > LINHAS + 3 && sobra > 0) { pedacos.push(resto.slice(0, LINHAS)); resto = resto.slice(LINHAS); sobra--; }
    pedacos.push(resto);
    let ini = 0;
    pedacos.forEach((linhas, p) => {
      const faixa = pedacos.length > 1 ? `itens ${ini + 1}–${ini + linhas.length} de ${total}` : '';
      ini += linhas.length;
      const blocoTab = { ...tab, linhas };
      if (p === 0) out.push({ ...primeiro, sub: [primeiro.sub, faixa].filter(Boolean).join(' · '), blocos: [...primeiro.blocos.filter((b) => b.tipo !== 'nota'), blocoTab, ...primeiro.blocos.filter((b) => b.tipo === 'nota')] });
      else out.push({ rotulo: c.rotulo, titulo: (c.tituloLista || c.titulo) + ' (cont.)', sub: faixa, blocos: [blocoTab], origem: c });
    });
  }
  return out;
}

    if (alvo && abrirVisorDaJanela(alvo)) { abrirConversa(); legendaSome(1500); return true; }
  }
  const cmd = entenderComando(frase, janelasParaComando());
  if (!cmd) return false;
  const el = paineisVivos[cmd.indice];
  diag('comando ' + cmd.acao);
  abrirConversa();
  legenda(`<span class="voce">${esc(frase)}</span>`);
  if (cmd.acao === 'fecharTudo') fecharTudo();
  else if (cmd.acao === 'fechar') fecharPainel(el);
  else if (cmd.acao === 'voltar') desfocar();
  else if (cmd.acao === 'focar') focar(el);
  else if (cmd.acao === 'zoom') { focar(el); Zoom.aproximar(el, cmd.fator); }
  else if (cmd.acao === 'explorar') { explorar(el); return true; }
  legendaSome(2500);
  return true;
}

// IMAGEM COM TRANSPARÊNCIA (02/out/2026) — João: "a imagem que vc trouxe não
// era moderna igual na versão azul, no modelo com transparência". O mapa de
// fertilidade vem do servidor como PNG de fundo BRANCO (é o mesmo do zap).
// Aqui, só na tela ao vivo: o branco vira transparente e o texto preto/cinza
// vira o creme da marca — o mapa colorido fica "flutuando" no vidro. Foto (sem
// fundo branco nos cantos) fica como veio.
function vidroNaImagem(img) {
  const fazer = () => {
    try {
      const w0 = img.naturalWidth, h0 = img.naturalHeight; if (!w0 || !h0) return;
      const f = Math.min(1, 1600 / Math.max(w0, h0)), w = Math.round(w0 * f), h = Math.round(h0 * f);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h), p = d.data;
      const claro = (i) => p[i] > 232 && p[i + 1] > 232 && p[i + 2] > 232;
      if ([0, (w - 1) * 4, (h - 1) * w * 4, ((h - 1) * w + w - 1) * 4].filter(claro).length < 3) return;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i], gg = p[i + 1], b = p[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
        const luz = (r + gg + b) / 765, sat = mx ? (mx - mn) / mx : 0;
        if (sat < 0.14) { p[i] = 241; p[i + 1] = 233; p[i + 2] = 196; p[i + 3] = Math.round(p[i + 3] * Math.min(1, (1 - luz) * 1.3)); }
        else if (luz > 0.8) p[i + 3] = Math.round(p[i + 3] * Math.min(1, (1 - luz) / 0.2 + sat));
      }
      x.putImageData(d, 0, 0);
      img.src = c.toDataURL('image/png');
    } catch (e) { /* imagem que o navegador não deixa ler: fica como veio */ }
  };
  if (img.complete && img.naturalWidth) fazer(); else img.addEventListener('load', fazer, { once: true });
}

let idGraf = 0;
function graficoBarras(dias, campo, rotulo, cor = '#c4ca3c', extra, todos = false) {
  const id = 'gb' + (++idGraf);
  const vs = dias.map((d) => Number(d[campo]) || 0); const max = Math.max(1, ...vs);
  const W = 640, H = 190, pad = 22, base = H - 28, alto = H - 58, bw = (W - pad * 2) / Math.max(1, dias.length);
  const grade = [0.25, 0.5, 0.75, 1].map((f) => `<line x1="${pad}" x2="${W - pad}" y1="${base - f * alto}" y2="${base - f * alto}" stroke="rgba(196,202,60,.10)" stroke-dasharray="3 5"/>` +
    (todos ? `<text x="${pad - 4}" y="${base - f * alto + 4}" fill="#b3a97a" font-size="10" text-anchor="end" font-family="Menlo,monospace">${num(max * f)}</text>` : '')).join('');
  const barras = dias.map((d, i) => { const v = vs[i], h = (v / max) * alto; const x = pad + i * bw;
    return `<rect x="${x + bw * 0.18}" y="${base - h}" width="${bw * 0.64}" height="${Math.max(h, v > 0 ? 2 : 0)}" rx="3" fill="url(#${id})" filter="url(#${id}b)"><title>${esc(d.dia)}: ${num(v)} ${rotulo}</title></rect>` +
      (v > 0 ? `<rect x="${x + bw * 0.18}" y="${base - h}" width="${bw * 0.64}" height="2" fill="#f1e9c4" opacity=".8"/>` : '') +
      ((todos || v >= max * 0.2) && v > 0 ? `<text x="${x + bw / 2}" y="${base - h - 7}" fill="#f1e9c4" font-size="13" font-weight="700" text-anchor="middle">${num(v)}</text>` : '') +
      ((todos || dias.length <= 16 || i % Math.ceil(dias.length / 12) === 0) ? `<text x="${x + bw / 2}" y="${H - 8}" fill="#b3a97a" font-size="11" text-anchor="middle" font-family="Menlo,monospace">${esc(String(d.dia).slice(0, 5))}</text>` : '');
  }).join('');
  let linha = '';
  if (extra) {
    const pts = dias.map((d, i) => { const v = Number(d[extra]); if (!isFinite(v) || d[extra] == null) return null; return [pad + i * bw + bw / 2, base - (v / max) * alto, v, d.dia]; }).filter(Boolean);
    linha = (pts.length > 1 ? `<polyline points="${pts.map((p) => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="#f9a322" stroke-width="1.5" opacity=".6"/>` : '') +
      pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#f9a322" filter="url(#${id}b)"><title>${esc(p[3])}: ${num(p[2])} lançado</title></circle>`).join('');
  }
  return `<svg class="graf" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${cor}" stop-opacity=".18"/><stop offset="1" stop-color="${cor}" stop-opacity=".95"/></linearGradient>` +
    `<filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>` +
    `${grade}<line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" stroke="rgba(196,202,60,.35)"/>${barras}${linha}</svg>`;
}

const NOMES = { clientes: 'Clientes', pedidos: 'Pedidos', pedidos_em_aberto: 'Pedidos em aberto', estoque_produto: 'Estoque da fábrica', silos: 'Silos', cotacoes: 'Cotações', laboratorio: 'Laboratório', pedidos_lab: 'Pedidos do laboratório', pendencias_do_fisco: 'Pendências do fisco', boletim_diario: 'Boletim' };
function desenhoGenerico(r, _a, nome) {
  const rotuloCampo = (k) => k.replace(/_rs$/, '').replace(/_/g, ' ');
  const ehPista = (k) => /^(instrucao|aviso|dica|como_ler|como_usar|fonte|origem|contagem_origem)$/.test(k);
  const ks = []; let lista = null, listaNome = '';
  for (const [k, v] of Object.entries(r || {})) {
    if (ehPista(k)) continue;
    if (typeof v === 'number' && ks.length < 4) ks.push([/_rs$/.test(k) ? reais(v) : num(v, 2), rotuloCampo(k)]);
    if (Array.isArray(v) && v.length && typeof v[0] === 'object' && !lista) { lista = v; listaNome = k; }
  }
  const blocos = [];
  if (ks.length) blocos.push(K(ks));
  if (lista) {
    const cols = Object.keys(lista[0]).filter((k) => ['string', 'number'].includes(typeof lista[0][k])).slice(0, 4);
    blocos.push(T(cols.map(rotuloCampo), lista.slice(0, 60).map((l) => cols.map((c) => typeof l[c] === 'number' ? (/_rs$/.test(c) ? reais(l[c]) : num(l[c], 2)) : esc(l[c])))));
  }
  if (!blocos.length) return null;
  return { rotulo: NOMES[nome] || rotuloCampo(nome || 'consulta'), titulo: listaNome ? rotuloCampo(listaNome) : (NOMES[nome] || ''), tituloLista: listaNome ? rotuloCampo(listaNome) : '', blocos };

/** Encaixa os ladrilhos (formas {w,h,alt}) numa grade C×R, na ordem de prioridade:

    while (p.col > 0 && Array.from({ length: p.h }, (_, k) => ocup[p.row + k][p.col - 1]).every((v) => v < 0)) { p.col--; p.w++; for (let k = 0; k < p.h; k++) ocup[p.row + k][p.col] = i; }

    ['clima', /^(a )?(chuvas?|clima|tempo|previsao( do tempo)?)$/],

    chuva_lancada: [['2026-08', 'Fazenda Exemplo', 0, 0], ['2026-09', 'Fazenda Exemplo', 64, 5], ['2026-09', 'Fazenda Modelo II', 51, 4]].map(([mes, fazenda, mm, dias]) => ({ mes, fazenda, mm, dias })),
    estoque,
    laboratorio: { analises_de_solo: fertilidade.length, outras: [{ matriz: 'Foliar', laudos: 4, amostras: 12, ultimo: d(-40) }], pedidos_encontrados: 6,
      pedidos: [['PED-0101', 'Pronto', 24], ['PED-0098', 'Em análise', 18], ['PED-0090', 'Finalizado', 40]].map(([numero, situacao, amostras], i) => ({ numero, situacao, amostras, entrada: dataBR(d(-10 - i * 12)), material: 'Solo' })) },
    financeiro: { total: 186400, meses: [['2026-07', 'fazenda', 42000], ['2026-08', 'fazenda', 61500], ['2026-09', 'fazenda', 70300], ['2026-09', 'pessoal', 12600]].map(([mes, ambito, total]) => ({ mes, ambito, total, lancamentos: 9 })),
      ultimas: [['Combustível', 'Diesel da semana', 8200], ['Manutenção', 'Peça do pulverizador', 3100], ['Mão de obra', 'Diárias', 5400]].map(([categoria, descricao, valor], i) => ({ data: d(-i * 3), ambito: 'fazenda', categoria, descricao, valor, pago: true })) },
    pede_atencao: ['5 produtos zerados no estoque da Fazenda Exemplo', 'Nota para conferir: Ureia (entrada repetida?)'],
    indisponivel: [],
  };
  if (D.escopo === 'fazenda') {
    const so = (l) => l.filter((x) => x.fazenda === 'Fazenda Exemplo');
    Object.assign(D, { fazendas: so(D.fazendas), talhoes: so(D.talhoes), fertilidade: so(D.fertilidade), aplicacoes: so(D.aplicacoes), estoque: so(D.estoque) });
    D.clima.fazendas = so(D.clima.fazendas);
  }
  return D;
}
async function respostaDemo(t) {
  await new Promise((ok) => setTimeout(ok, 900));
  const n = norm(t);
  // o DOSSIÊ (modo fazenda/grupo) e a evolução da lavoura — dados inventados
  if (/tudo sobre|grupo|dossie|fazenda inteira|resumo da fazenda|resumo de tudo/.test(n)) {
    const soFazenda = /fazenda exemplo|resumo da fazenda|fazenda inteira/.test(n) && !/grupo/.test(n);
    return { texto: soFazenda ? 'A Fazenda Exemplo inteira está na sua tela, senhor. Duas visitas abertas pedem atenção.' : 'O Grupo Exemplo tem três fazendas, uns 4 mil hectares. O dossiê completo está na sua tela, senhor.',
      telas: [{ ferramenta: 'resumo_completo', argumentos: {}, resultado: dossieDemo(soFazenda ? 'fazenda' : 'cliente') }] };
  }
  if (/aplica|plantio|lavoura|evolu|caderno|plantinha/.test(n)) return { texto: 'A soja do talhão 01 está com uns 35 dias, senhor. As aplicações do plano estão na linha da lavoura, na sua tela.', telas: [{ ferramenta: 'resumo_completo', argumentos: {}, resultado: dossieDemo('fazenda', 'evolucao') }] };
  if (/mapas/.test(n)) return { texto: 'Os mapas de fósforo, potássio, pH e matéria orgânica da Fazenda Exemplo estão na sua tela, senhor.',
    telas: [['P', 1], ['K', 2], ['pH', 3], ['MO', 4]].map(([nome, k]) => ({ ferramenta: 'imagem', argumentos: {}, resultado: { legenda: `Mapa de ${nome} · Fazenda Exemplo`, mime: 'image/png', base64: mapaDemoQuadrado(nome, k) } })) };
  if (/resumo|tudo|geral|bom dia/.test(n)) return { texto: 'Aqui está o resumo do dia, senhor. Plantio, chuva, contas e agenda estão na tela.', telas: [DEMO_TELAS.monit(), DEMO_TELAS.clima(), DEMO_TELAS.contas(), DEMO_TELAS.agenda()] };
  if (/mapa|fertilidade|fosforo|potassio/.test(n)) return { texto: 'O mapa de fósforo da Fazenda Exemplo está na tela. A média ficou em 18 miligramas.', telas: [DEMO_TELAS.fert(), { ferramenta: 'imagem', argumentos: {}, resultado: { legenda: 'Fósforo (P) — Fazenda Exemplo', mime: 'image/png', base64: mapaDemo() } }] };
  if (/chuv|clima/.test(n)) return { texto: 'Choveu uns 38 milímetros nos últimos sete dias na Fazenda Exemplo, senhor. A maior chuva foi de 21 milímetros, no dia 29.', telas: [DEMO_TELAS.clima(), DEMO_TELAS.satelite()] };
  if (/estoque/.test(n)) return { texto: 'O estoque da Fazenda Exemplo soma uns 412 mil reais. Três produtos estão abaixo do mínimo.', telas: [DEMO_TELAS.estoque()] };
  if (/conta/.test(n)) return { texto: 'Há 7 contas na semana, somando uns 89 mil reais. A maior é a do Fornecedor B, de 42 mil, na segunda.', telas: [DEMO_TELAS.contas()] };
  return { texto: 'Na Fazenda Exemplo a média ficou em 9,8 plantas por metro, com coeficiente de variação médio de 44,7 por cento.', telas: [DEMO_TELAS.monit()] };
}

// ---------------------------------------------------------------------------
// Ligar tudo
// ---------------------------------------------------------------------------
let iniciado = false;
// iniciar(pergunta): sem pergunta é o INICIAR de sempre (saudação). Com
// pergunta (string, mesmo vazia) é o OUVIDO DO MAC que chamou: sem saudação,
// já pergunta o que o João disse depois do "Oscar".
function iniciar(pergunta) {
  const chamado = typeof pergunta === 'string';
  iniciado = true;
  $('abertura').style.display = 'none';
  Voz.destravar();
  prepararVozNatural();
  if (MODO_GRAVADOR || Ouvido.disponivel) { Escuta.ligar().then((ok) => { if (ok && fase !== 'falando' && fase !== 'pensando') mudarFase('ouvindo'); atualizarMic(); }); }
  else { aviso('Este navegador não deixa usar o microfone. Dá para escrever na caixa embaixo.'); mudarFase('espera'); }
  atualizarMic();
  if (chamado) { receberChamado(pergunta); return; }
  const saudacao = IOS ? 'Olá. Estou ouvindo. Pode perguntar.' : 'Olá. Estou ouvindo. Pode perguntar; depois, é só me chamar de Oscar.';
  legenda(esc(saudacao));
  // João, 02/out/2026: "no início ele falou com a voz do Mac, depois voltou com
  // a outra" — a saudação saía antes de a voz natural terminar de carregar.
  // Espera a natural até 5 s; não ficou pronta, a saudação fica só escrita.
  if (!IOS) {
    const t0 = Date.now();
    const esperar = () => {
      if (VozNatural.pronta) { if (fase !== 'falando' && fase !== 'pensando') falarEmTurno(saudacao); }
      else if (Date.now() - t0 < 5000) setTimeout(esperar, 200);
    };
    esperar();
  }
}
$('comecar').onclick = () => iniciar(chamadoEsperando ?? undefined);

// ---------------------------------------------------------------------------
// OUVIDO DO MAC (02/out/2026) — João: "quando eu disser Oscar, a janela do
// Oscarpes ao vivo aparece e responde", mesmo com nada aberto. Um programinha
// no Mac (ouvido-mac/) ouve o "Oscar" DENTRO do Mac e abre esta página com
//   ?chamado=1&id=<hora>&pergunta=<o que veio depois do "Oscar">
// Três caminhos, conforme o que já está aberto:
//  1. App instalado ("Instalar Oscarpes") e já aberto: o manifesto tem
//     launch_handler "focus-existing" — o Chrome traz a janela para a frente e
//     entrega o endereço pelo launchQueue, SEM abrir outra janela.
//  2. Outra aba/janela desta página já iniciada: a nova pergunta "tem alguém
//     aí?" no BroadcastChannel, entrega a pergunta para a que responder e se fecha.
//  3. Nada aberto: esta mesma página inicia sozinha e pergunta. O Chrome só
//     deixa tocar som sem um clique quando o site é app instalado (ou muito
//     usado); se não deixar, a tela de abertura mostra a pergunta e o botão
//     RESPONDER — um clique e segue.
// O id evita responder duas vezes ao mesmo chamado (o launchQueue também
// entrega o endereço da primeira abertura, que o caminho 3 já tratou).
// ---------------------------------------------------------------------------
/** Lê o chamado do endereço: { id, pergunta } ou null. */
function lerChamado(busca) { const p = new URLSearchParams(busca || ''); if (!p.has('chamado')) return null; return { id: p.get('id') || String(p.get('pergunta') || ''), pergunta: String(p.get('pergunta') || '').trim().slice(0, 500) }; }
const chamadosAtendidos = new Set();
let chamadoEsperando = null;            // pergunta esperando o clique em RESPONDER
/** Página já iniciada recebe um chamado do ouvido do Mac. */
function receberChamado(pergunta) {
  diag('chamado do mac');
  abrirConversa();                       // conversa corrida: a resposta não precisa de outro "Oscar"
  try { window.focus(); } catch (e) {}
  if (ocupado) return;                   // já pensando numa pergunta: a resposta vem
  Voz.parar();
  if (pergunta) { perguntar(pergunta); return; }
  legenda(esc('Pode falar.'));
  falarEmTurno('Pode falar.');
}
/** O Chrome deixa tocar som sem clique aqui? (app instalado / site muito usado) */
function somLiberado() {
  try { if (navigator.getAutoplayPolicy) return navigator.getAutoplayPolicy('audiocontext') === 'allowed'; } catch (e) {}
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); const ok = c.state === 'running'; c.close(); return ok; } catch (e) { return false; }
}
function atenderChamado(ch) {
  if (!ch || chamadosAtendidos.has(ch.id)) return;
  chamadosAtendidos.add(ch.id);
  if (iniciado) { receberChamado(ch.pergunta); return; }
  if (somLiberado()) { iniciar(ch.pergunta); return; }
  // sem som liberado: um clique em RESPONDER e já pergunta
  chamadoEsperando = ch.pergunta;
  $('comecar').textContent = 'RESPONDER';
  const p = $('abertura').querySelector('p');
  if (p) p.textContent = ch.pergunta ? `Você disse: “${ch.pergunta}”. Clique para eu responder.` : 'Você me chamou. Clique para eu ouvir.';
}
const canal = ('BroadcastChannel' in window) ? new BroadcastChannel('oscarpes-ao-vivo') : null;
const EU = Math.random().toString(36).slice(2);
if (canal) canal.onmessage = (ev) => {
  const m = ev.data || {};
  if (m.tipo === 'quem-esta-aberto' && iniciado) canal.postMessage({ tipo: 'estou', para: m.de, de: EU });
  if (m.tipo === 'chamado' && m.para === EU) atenderChamado(m.chamado);
};
(async () => {
  const ch = lerChamado(location.search);
  if (!ch) return;
  // o endereço volta a ser o simples: recarregar não repete a pergunta
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (canal) {
    const outra = await new Promise((ok) => {
      const t = setTimeout(() => ok(null), 400);
      const ouvir = (ev) => { if (ev.data && ev.data.tipo === 'estou' && ev.data.para === EU) { clearTimeout(t); canal.removeEventListener('message', ouvir); ok(ev.data.de); } };
      canal.addEventListener('message', ouvir);
      canal.postMessage({ tipo: 'quem-esta-aberto', de: EU });
    });
    if (outra) {
      chamadosAtendidos.add(ch.id);
      canal.postMessage({ tipo: 'chamado', para: outra, chamado: ch });
      window.close();                    // o Chrome deixa fechar uma aba que só tem esta página no histórico
      $('comecar').style.display = 'none';
      const p = $('abertura').querySelector('p'); if (p) p.textContent = 'Mandei a pergunta para a janela do Oscarpes que já estava aberta. Pode fechar esta.';
      return;
    }
  }
  atenderChamado(ch);
})();
// app instalado já aberto: o Chrome entrega aqui o endereço do chamado
if ('launchQueue' in window) window.launchQueue.setConsumer((lp) => { try { if (lp && lp.targetURL) atenderChamado(lerChamado(new URL(lp.targetURL).search)); } catch (e) {} });
// VOZ NATURAL: prepara sozinha (o toque em INICIAR é o pedido; o João, 02/out:
// "a voz ainda tá a do iPhone") e mostra no topo qual voz está falando.
function seloVoz(t) { $('vozChip').textContent = t; }
async function prepararVozNatural() {
  if (!VozNatural.possivel) { seloVoz('VOZ: APARELHO'); return; }
  if (VozNatural.pronta) { seloVoz('VOZ: NATURAL'); return; }
  try {
    seloVoz('VOZ: PREPARANDO');
    await VozNatural.preparar((f) => seloVoz(f < 1 ? `VOZ: BAIXANDO ${Math.round(f * 100)}%` : 'VOZ: PREPARANDO'));
    seloVoz('VOZ: NATURAL');
    // aquece o motor e deixa os avisos de espera prontos (saem sem esperar geração)
    setTimeout(() => VozNatural.aquecer(AVISOS_DE_ESPERA), 400);
  } catch (e) {
    console.log('[ao-vivo] voz natural não preparou', e);
    seloVoz('VOZ: APARELHO');
  }
}
(async () => { if (VozNatural.possivel && await VozNatural.jaBaixada()) prepararVozNatural(); else seloVoz(VozNatural.possivel ? '' : 'VOZ: APARELHO'); })();
// MICROFONE (02/out/2026, "pausar o microfone não volta mais"): antes o botão só
// pausava se estivesse em "ouvindo" E o reconhecimento estivesse de pé naquele
// instante — no Chrome, entre uma religada e outra (ou enquanto falava), o toque
// caía no "ligar" e a pausa não pausava; e pausar durante a fala não existia.
// Agora: falando → interrompe e volta a ouvir; ligado → pausa; desligado → liga.
$('mic').onclick = async () => {
  // (o destravar fala um " " mudo — por isso a pergunta "está falando?" vem ANTES dele)
  const falandoAgora = Voz.falando || fase === 'falando';
  Voz.destravar();
  if (falandoAgora) {
    Voz.parar();
    if (Escuta.ligado) { mudarFase('ouvindo'); Escuta.retomar(); }
    else if (await Escuta.ligar()) mudarFase('ouvindo');
  } else if (Escuta.ligado && fase !== 'toque') { Escuta.desligar(); mudarFase('espera'); }
  else if (await Escuta.ligar()) mudarFase('ouvindo');
  atualizarMic();
};
$('esfera').onclick = () => {        // tocar na folha: volta a ouvir (o iPhone exige um toque)
  Voz.destravar();
  if (Voz.falando) { Voz.parar(); }
  if (ocupado) return;                 // pensando: a resposta já vem
  Escuta.ligar().then((ok) => { if (ok) mudarFase('ouvindo'); atualizarMic(); });
};
$('caixa').onsubmit = (e) => { e.preventDefault(); const t = $('digitado').value.trim(); $('digitado').value = ''; if (t) { Voz.parar(); perguntar(t); } };
document.addEventListener('visibilitychange', () => { if (document.hidden) Voz.parar(); });
mudarFase('espera');
</script>
