<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Apresentação</title>
<!-- VISOR DE APRESENTAÇÃO (05/out/2026). O Storage do Supabase devolve HTML como texto puro, então o link que o
     agente manda é este visor com o link assinado no FRAGMENTO: /apresentacao/#u=<link assinado de 7 dias>.
     O fragmento não vai ao servidor do site. O visor baixa o arquivo e o abre num iframe isolado (sandbox, srcdoc) (tela inteira,
     teclas e som funcionam). "Baixar" salva o .html único (abre sem internet).
     A tela ao vivo (Jarvis) também usa este visor e manda as ordens de voz por postMessage — o visor repassa
     ao iframe. Sem link válido: avisa, sem mais nada.
     09/out/2026 — PÁGINA DO COFRE (revenda): #u=<link assinado do balde cofre>&k=<chave>. O arquivo no balde é
     CIFRADO (AES-256-GCM, iv de 12 bytes na frente, AAD "cofre-pagina"); a chave só existe no fragmento do link que
     a revenda recebeu no zap — o fragmento não vai a servidor nenhum, então nem o site nem o Storage leem a página. -->
<style>
:root{--fundo:#0b0b0b;--texto:#f1f1f1;--mudo:#9a9a9a;--acento:#f9a322}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:400 16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--fundo)}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
#msg b{color:var(--acento)}
#barra{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;z-index:3;opacity:.25;transition:opacity .3s}
#barra:hover{opacity:1}
#barra button{background:rgba(0,0,0,.6);color:var(--texto);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
body.embutido #barra{display:none}
</style></head>
<body>
<div id="msg">Abrindo a apresentação…</div>
<div id="barra" hidden><button id="cheia" type="button">Tela cheia</button><button id="baixar" type="button">Baixar</button></div>
<script>
'use strict';
(async () => {
  const msg = document.getElementById('msg');
  if (window.parent !== window) document.body.classList.add('embutido');
  const frag = new URLSearchParams(location.hash.slice(1));
  let u = frag.get('u') || '';
  // LINK CURTO (10/out/2026): #c=<código> → o link assinado guardado em links_curtos (função link_curto, sem login).
  // A chave pública entra no deploy (scripts/deploy-web.sh troca o marcador, como na página ao vivo).
  const c = frag.get('c') || '';
  if (!u && /^[A-Za-z0-9]{8}$/.test(c)) {
    try {
      const chave = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqdGZ3aXBncWVyeWV1a3JleXN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNTI1MTksImV4cCI6MjA5MjcyODUxOX0.DG0pLGoPbo8W50_AeXb1zA0BALCchyKPAGFfP3hghcM';
      const r = await fetch('https://sjtfwipgqeryeukreyst.supabase.co/rest/v1/rpc/link_curto', {
        method: 'POST', headers: { apikey: chave, Authorization: 'Bearer ' + chave, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_codigo: c }),
      });
      const d = r.ok ? await r.json() : null;
      if (typeof d === 'string') u = d;
    } catch (e) {}
    if (!u) { msg.innerHTML = 'O link venceu ou não abriu. Peça um link novo ao agente: <b>“manda de novo o relatório”</b>.'; return; }
  }
  const k = frag.get('k') || '';
  // só link assinado do Storage do Supabase (nada de endereço qualquer dentro do visor)
  let ok = false;
  try { const x = new URL(u); ok = x.protocol === 'https:' && /\.supabase\.co$/.test(x.hostname) && (x.pathname.startsWith('/storage/v1/object/sign/apresentacoes/') || (k && x.pathname.startsWith('/storage/v1/object/sign/cofre/'))); } catch (e) {}
  if (!ok) { msg.innerHTML = 'Link de apresentação inválido. Peça um link novo ao agente: <b>“manda de novo a apresentação”</b>.'; return; }
  let html;
  try {
    const r = await fetch(u, { referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error(String(r.status));
    if (k) {
      // a página do cofre: decifra aqui, no aparelho de quem recebeu o link
      const b = new Uint8Array(await r.arrayBuffer());
      const bruta = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
      const chave = await crypto.subtle.importKey('raw', bruta, 'AES-GCM', false, ['decrypt']);
      const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12), additionalData: new TextEncoder().encode('cofre-pagina') }, chave, b.slice(12));
      html = new TextDecoder().decode(claro);
    } else html = await r.text();
  } catch (e) { msg.innerHTML = 'O link venceu ou não abriu (vale 7 dias). Peça um link novo ao agente: <b>“manda de novo a apresentação”</b>.'; return; }
  const nome = (decodeURIComponent(new URL(u).pathname.split('/').pop() || 'apresentacao.html')).replace(/\.bin$/, '.html').replace(/[^a-z0-9.-]/gi, '-');
  const titulo = (html.match(/<title>([^<]*)<\/title>/) || [0, 'Apresentação'])[1];
  document.title = titulo.replace(/&amp;/g, '&');
  const blob = new Blob([html], { type: 'text/html' }), url = URL.createObjectURL(blob);
  // sandbox SEM allow-same-origin: a apresentação roda isolada (não alcança a sessão do app guardada neste endereço).
  // allow-popups (06/out/2026): o "Abrir no mapa" do relatório da visita abre o Google Maps numa aba nova, fora da caixa.
  const f = document.createElement('iframe'); f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox'); f.allow = 'fullscreen; autoplay'; f.setAttribute('allowfullscreen', ''); f.srcdoc = html;
  document.body.appendChild(f); msg.remove();
  f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) {} });
  const barra = document.getElementById('barra'); barra.hidden = false;
  document.getElementById('cheia').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); f.contentWindow.focus(); };
  document.getElementById('baixar').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); };
  // ordens da tela ao vivo → a apresentação; o "tela cheia" é do visor (o iframe ocupa tudo)
  addEventListener('message', (e) => {
    const d = e.data || {};
    if (e.source === f.contentWindow) { if (window.parent !== window) window.parent.postMessage(d, '*'); return; }
    if (!d.apresentacao) return;
    if (d.apresentacao === 'cheia') { document.getElementById('cheia').click(); return; }
    f.contentWindow.postMessage(d, '*');
  });
})();
</script>
</body></html>
