// ============================================================================
// CAIXA DE SOCORRO DO APP WEB (injetada no index/404 pelo scripts/deploy-web.sh)
// ============================================================================
// Nasceu em 13/ago/2026 (rodada 16/17): quando o app não abre, a caixa vermelha
// mostra o porquê — foi ela que achou o Google Tradutor quebrando o React.
//
// 01/out/2026 — ALARME FALSO. Em 30/set a caixa apareceu na DRE dizendo "20s e
// nada renderizou" com a tela INTEIRA desenhada. A causa estava na regra antiga:
//   1. a conferência dos 20 s era UMA foto: se naquele instante o #root ainda
//      estava vazio (pacote de vários MB ainda baixando numa rede lenta, ou a
//      aba aberta em segundo plano), a caixa nascia;
//   2. e NUNCA MAIS SAÍA. Ninguém olhava de novo: o app desenhava 2 s depois e
//      a caixa ficava por cima, mentindo, até recarregar a página.
// A regra nova (`decidirSocorro`, pura, provada no
// scripts/conferir-socorro-web.js) olha o estado A CADA SEGUNDO:
//   · #root com filhos = o app está na tela → caixa NÃO aparece, e se já
//     estava, SOME (erro que aconteceu antes do primeiro desenho e não impediu
//     o app de abrir não é "o app não abriu");
//   · o relógio dos 20 s só anda com a aba VISÍVEL (aba em segundo plano o
//     navegador segura o desenho — não é defeito);
//   · passados os 20 s, diz QUAL dos dois casos é: o pacote ainda não terminou
//     de baixar (document.readyState === 'loading': o <script defer> do
//     entry-*.js segura o DOMContentLoaded) ou baixou e nada desenhou;
//   · erro de JS com o #root vazio aparece depois de 3 s visíveis com o pacote
//     já carregado (antes disso é o próprio boot, e o desenho resolve).
//
// O MESMO arquivo serve aos dois mundos: no Node (o portão) ele só exporta as
// funções; no navegador ele se instala. O deploy injeta o conteúdo inteiro
// dentro de um <script> — por isso nada aqui pode conter a tag de fechamento
// de script.
// ============================================================================
(function () {
  var LIMITE_NADA_MS = 20000;   // sem erro: quanto tempo VISÍVEL até alarmar
  var LIMITE_ERRO_MS = 3000;    // com erro e #root vazio: quanto até mostrar

  /**
   * A regra, sem DOM. Devolve as linhas da caixa, ou null = sem caixa.
   * estado = { raizTemFilhos, erros: string[], visivelMs, documentoPronto, tradutor }
   */
  function decidirSocorro(estado) {
    if (estado.raizTemFilhos) return null;   // o app está na tela: nunca intromete
    var linhas = (estado.erros || []).slice();
    var visivel = estado.visivelMs || 0;
    if (visivel >= LIMITE_NADA_MS) {
      linhas.push(estado.documentoPronto
        ? Math.round(visivel / 1000) + 's e nada renderizou' +
          (linhas.length ? '' : ' (nenhum erro de JS — o pacote baixou e não desenhou)')
        : Math.round(visivel / 1000) + 's e o pacote do app ainda não terminou de baixar (rede lenta ou bloqueada)');
    } else if (!(linhas.length && estado.documentoPronto && visivel >= LIMITE_ERRO_MS)) {
      return null;
    }
    return ['⚠️ O app não abriu. Mande um print desta caixa:' +
      (estado.tradutor ? ' [TRADUTOR ATIVO]' : '')].concat(linhas);
  }

  /** Instala no navegador. `win`/`doc` entram por parâmetro para o portão poder simular. */
  function instalarSocorro(win, doc) {
    var NodeCtor = win.Node;
    if (typeof NodeCtor === 'function' && NodeCtor.prototype) {
      // ANTI-TRADUTOR (13/ago): removeChild/insertBefore tolerantes a nós que o
      // Google Tradutor ou uma extensão mexeram (facebook/react#11538).
      var rc = NodeCtor.prototype.removeChild;
      NodeCtor.prototype.removeChild = function (filho) {
        if (filho && filho.parentNode !== this) { win.console.error('[anti-tradutor] removeChild de outro pai ignorado'); return filho; }
        return rc.apply(this, arguments);
      };
      var ib = NodeCtor.prototype.insertBefore;
      NodeCtor.prototype.insertBefore = function (novo, ref) {
        if (ref && ref.parentNode !== this) { win.console.error('[anti-tradutor] insertBefore com ref de outro pai ignorado'); return ib.call(this, novo, null); }
        return ib.apply(this, arguments);
      };
    }

    var erros = [];
    var visivelMs = 0;
    var ultimo = Date.now();

    function avaliar() {
      var agora = Date.now();
      if (!doc.hidden) visivelMs += Math.max(0, Math.min(agora - ultimo, 5000));
      ultimo = agora;
      var raiz = doc.getElementById('root');
      var linhas = decidirSocorro({
        raizTemFilhos: !!(raiz && raiz.children && raiz.children.length > 0),
        erros: erros,
        visivelMs: visivelMs,
        documentoPronto: doc.readyState !== 'loading',
        tradutor: /translated/.test(String(doc.documentElement && doc.documentElement.className || '')),
      });
      var caixa = doc.getElementById('socorro-oscarpes');
      if (!linhas) {
        if (caixa && caixa.parentNode) caixa.parentNode.removeChild(caixa);   // o app desenhou: some
        return;
      }
      if (!doc.body) return;
      if (!caixa) {
        caixa = doc.createElement('div');
        caixa.id = 'socorro-oscarpes';
        caixa.className = 'notranslate';
        caixa.setAttribute('translate', 'no');
        caixa.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#7a1010;color:#fff;font:12px monospace;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:45vh;overflow:auto';
        doc.body.appendChild(caixa);
      }
      caixa.textContent = linhas.join('\n');
    }

    function anotar(msg) {
      // depois que o app desenhou, erro é assunto do console, não da caixa
      var raiz = doc.getElementById('root');
      if (raiz && raiz.children && raiz.children.length > 0) return;
      if (erros.length < 20) erros.push(msg);
      avaliar();
    }
    win.addEventListener('error', function (e) {
      var pilha = (e.error && e.error.stack ? '\n   ' + String(e.error.stack).split('\n').slice(0, 2).join(' | ').slice(0, 200) : '');
      anotar((e.message || 'erro') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno + pilha);
    });
    win.addEventListener('unhandledrejection', function (e) {
      anotar('promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
    });
    doc.addEventListener('visibilitychange', function () { ultimo = Date.now(); avaliar(); });
    // 1×/s: duas leituras de DOM, nada mais. Continua depois do desenho porque
    // a árvore inteira desmontando (crash sem ErroBoundary) também é "não abriu".
    win.setInterval(avaliar, 1000);
    return { avaliar: avaliar, erros: erros };
  }

  if (typeof module === 'object' && module && module.exports) {
    module.exports = { decidirSocorro: decidirSocorro, instalarSocorro: instalarSocorro, LIMITE_NADA_MS: LIMITE_NADA_MS, LIMITE_ERRO_MS: LIMITE_ERRO_MS };
  } else if (typeof window !== 'undefined' && typeof document !== 'undefined') {
    instalarSocorro(window, document);
  }
})();

</script>
<script id="oscarpes-versao">
/* Versao CARREGADA — gravada no index na hora da publicacao. Se o navegador
   mostrar uma data velha aqui, e porque o index e velho: prova de cache.
   O app le window.__OSCARPES_BUILD__ e mostra na tela de login e no Hub. */
window.__OSCARPES_BUILD__ = {"bundle": "entry-8ec558b80757f026b3a723305c53c62a.js", "publicado": "2026-10-10T21:38:11"};
(function () {
  function checar() {
    try {
      var meu = null;
      var tags = document.getElementsByTagName('script');
      for (var i = 0; i < tags.length; i++) {
        var s = tags[i].src || '';
        var m = s.match(/(entry-[a-f0-9]+\.js)/);
        if (m) { meu = m[1]; break; }
      }
      if (!meu) { console.log('[Oscarpes] versao: nao achei o pacote no index'); return; }
      fetch('/versao.json?cb=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (v) {
          if (!v || !v.bundle) return;
          if (v.bundle === meu) {
            /* chegou: limpa a marca pra proxima publicacao ser pega tambem */
            sessionStorage.removeItem('oscarpes_alvo');
            console.log('[Oscarpes] versao atual: ' + meu);
            return;
          }
          /* MARCAR QUAL pacote se esta buscando, nao apenas "ja recarreguei".
             ANTES daqui a marca era um sim/nao: depois da PRIMEIRA recarga da
             sessao o app parava de conferir pra sempre. Em 23/set/2026 o Joao
             ficou preso num pacote do comeco do dia enquanto dez publicacoes
             passavam, e viu a coluna do laboratorio ainda ilegivel horas
             depois de consertada. */
          var alvo = sessionStorage.getItem('oscarpes_alvo');
          if (alvo === v.bundle) {
            /* Ja recarregamos atras DESTE pacote e continuamos no antigo: a
               recarga nao venceu o cache. Nao ficar em laco — avisar. */
            console.log('[Oscarpes] recarreguei atras de ' + v.bundle + ' e continuo em ' + meu + ' — cache preso');
            avisarPreso(v.bundle);
            return;
          }
          sessionStorage.setItem('oscarpes_alvo', v.bundle);
          console.log('[Oscarpes] versao nova (' + v.bundle + '), recarregando');
          var recarregar = function () { location.replace(location.pathname + '?v=' + Date.now()); };
          var limpezas = [];
          if (window.caches && caches.keys) {
            limpezas.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            limpezas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          Promise.all(limpezas).then(recarregar).catch(recarregar);
        })
        .catch(function () { /* offline: fica com o que tem, que e o certo */ });
    } catch (e) { /* nunca derrubar o app por causa disto */ }
  }

  /* Quando nem a recarga vence o cache, o app nao pode ficar mudo: quem esta
     usando precisa saber que esta vendo uma versao velha e como sair dela. */
  function avisarPreso(novo) {
    try {
      if (document.getElementById('oscarpes-preso')) return;
      var d = document.createElement('div');
      d.id = 'oscarpes-preso';
      d.setAttribute('role', 'status');
      d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;'
        + 'background:#F9A322;color:#1B2704;font:600 13px/1.35 -apple-system,Helvetica,Arial,sans-serif;'
        + 'padding:10px 12px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35);'
        + 'display:flex;gap:10px;align-items:center;justify-content:space-between';
      var t = document.createElement('span');
      t.textContent = 'Voce esta vendo uma versao antiga do app. Toque para atualizar.';
      var b = document.createElement('button');
      b.textContent = 'ATUALIZAR';
      b.style.cssText = 'background:#1B2704;color:#F6F2E2;border:0;border-radius:8px;'
        + 'padding:8px 12px;font:700 12px/1 inherit;letter-spacing:.5px;flex:none';
      b.onclick = function () {
        sessionStorage.removeItem('oscarpes_alvo');
        location.replace(location.pathname + '?v=' + Date.now());
      };
      d.appendChild(t); d.appendChild(b);
      document.body.appendChild(d);
    } catch (e) { /* o aviso nunca pode derrubar o app */ }
  }
  /* O pacote (entry-*.js) fica no FIM do body; este script fica no head.
     Sem esperar o DOM, a lista de scripts vem vazia e a checagem morre —
     foi exatamente o bug da primeira versao (11/set/2026, conferido no ar:
     zero requisicoes a versao.json). */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', checar);
  else checar();
})();
</script>
